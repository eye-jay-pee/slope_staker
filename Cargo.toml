[package]
name = "slope_staker"
version = "0.1.0"
edition = "2024"

[features]
default = ["persistence"]
persistence = []

[dependencies]
rfd = "0.15"
regex = "1.11.3"
eframe = { version = "0.31.0", features = ["persistence"] }
epaint = "0.31.0"
chrono = "0.4.40"
fixed = "1"
strum = "0.26"
strum_macros = "0.26"
egui-plotter = "0.6.0"
log = "0.4.28"
serde_json = "1.0.145"
serde = "1.0.228"
serde_derive = "1.0.228"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"              # to access the DOM (to hide the loading text)

